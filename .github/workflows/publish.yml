name: Render book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ---- R (packages listed in DESCRIPTION) ----
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2

      # ---- Julia (packages listed in Project.toml) ----
      # Quarto requires the exact Julia version recorded in Manifest.toml
      - name: Read Julia version from Manifest.toml
        id: julia-version
        run: echo "version=$(sed -n 's/^julia_version = "\(.*\)"/\1/p' Manifest.toml)" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ steps.julia-version.outputs.version }}
      - uses: julia-actions/cache@v2
      - name: Install Julia packages
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      # ---- Python / marimo (for the WASM apps) ----
      - uses: astral-sh/setup-uv@v6
      - name: Install Python deps
        run: uv sync

      - name: Render
        run: quarto render

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    # Only publish from main; PRs just check that the book builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
