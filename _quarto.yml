project:
  type: book
  output-dir: _book
  # Builds the marimo WASM apps in apps-src/ into _book/apps/ after each full render.
  post-render: scripts/build_apps.py
  render:
    - "*.qmd"
    - "chapters/*.qmd"
    - "!apps-src/"

book:
  title: "Introductory Statistics; MTH113 at the College of Staten Island"
  subtitle: "A collaborative open textbook"
  author:
    - name: "John Verzani"
    - name: "Colleague Name"
  date: today
  repo-url: https://github.com/mth229/StatBook
  repo-actions: [edit, issue, source]
  site-url: https://mth229.github.io/StatBook
  search: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-collecting-data.qmd
        - chapters/03-describing-data-graphs.qmd
        - chapters/04-describing-data.qmd
        - chapters/05-practice-describing-data.qmd
    - part: "Probability and Distributions"
      chapters:
        - chapters/06-probability.qmd
        - chapters/07-discrete-random-variables.qmd
        - chapters/08-normal-distribution.qmd
        - chapters/09-sampling-distributions.qmd
        - chapters/10-interactive-clt.qmd
    - part: "Inference"
      chapters:
        - chapters/11-confidence-intervals.qmd
        - chapters/12-hypothesis-testing.qmd
        - chapters/13-comparing-two-groups.qmd
    - part: "Relationships and Further Methods"
      chapters:
        - chapters/14-correlation-regression.qmd
        - chapters/15-chi-square.qmd
        - chapters/16-anova.qmd
        - chapters/17-resampling.qmd
    - references.qmd
  appendices:
    - chapters/appendix-r.qmd
    - chapters/appendix-julia.qmd
    - chapters/appendix-tables.qmd
    - chapters/appendix-algebra.qmd

bibliography: references.bib

execute:
  # Re-run code only when a chapter's source changes (local speed-up).
  # _freeze/ is git-ignored; CI re-executes everything from a clean checkout.
  freeze: auto
  echo: true
  warning: false

knitr:
  opts_chunk:
    fig.align: center
    comment: "#>"

format:
  # live-html = Quarto's html format + the quarto-live extension
  # (_extensions/r-wasm/live), which enables in-browser {webr} / {pyodide}
  # code cells and exercises. Pages without such cells render as plain html.
  live-html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    number-sections: true
    code-fold: false
    code-tools: true
    code-copy: true
    callout-appearance: simple
    crossref:
      chapters: true
  # Uncomment for a PDF build (needs TinyTeX: `quarto install tinytex`).
  # pdf:
  #   documentclass: scrreprt
