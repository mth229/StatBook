# Configuration for the typos spell checker (.github/workflows/SpellCheck.yml)
[files]
extend-exclude = [
  "_extensions/",   # vendored quarto-live extension (minified JS/CSS)
  "Manifest.toml",  # generated by Julia's Pkg; contains package names
  "_book/",
  "_freeze/",
  ".quarto/",
]

[default.extend-words]
# coin-flip sequences such as HHT, THT
tht = "tht"
